name: Box Office Scheduler

on:
  # Primary scheduler. This workflow does not touch AMC; it only dispatches the
  # Box Office Pipeline with explicit inputs. The VPS runs the same scheduler
  # code as a watchdog fallback after a grace window.
  # GitHub drops most ticks of a `*/30` cron on this repo: 3-5 of the 48
  # daily ticks actually ran on every day from 2026-10-26 to 2026-11-07 (the
  # VPS watchdog quietly carried the rest until its token was revoked on
  # 2026-11-06 and Saturday 11-07 lost every AMC snapshot slot). :00 and :30
  # are GitHub's busiest cron minutes; off-peak minutes are serviced far
  # more often, and several entries give each slot several chances. The
  # scheduler dedups against existing runs and the concurrency group
  # serialises the ticks, so extra ticks are free.
  schedule:
    - cron: '4,19,34,49 * * * *'
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print due dispatches without starting the pipeline'
        required: false
        default: 'false'
      lookback_minutes:
        description: 'UTC lookback window for delayed GitHub schedule ticks'
        required: false
        default: '75'

permissions:
  actions: write
  contents: read

concurrency:
  group: box-office-scheduler
  cancel-in-progress: false

jobs:
  dispatch-due-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: box-office-pipeline.yml
      TARGET_REF: main
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      LOOKBACK_MINUTES: ${{ github.event.inputs.lookback_minutes || '75' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Dispatch due Box Office Pipeline slots
        run: |
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python3 box-office-tracker/scripts/schedule_box_office_pipeline.py \
            --mode primary \
            --repo "${{ github.repository }}" \
            --workflow "$TARGET_WORKFLOW" \
            --ref "$TARGET_REF" \
            --lookback-minutes "$LOOKBACK_MINUTES" \
            $DRY_RUN_FLAG
