name: Box Office Pipeline
run-name: >-
  ${{ github.event.inputs.schedule_slot != '' && format('box office scheduled {0}', github.event.inputs.schedule_slot) || format('box office {0}', github.event.inputs.phase == 'scrape' && (github.event.inputs.snapshots_only == 'true' && 'scrape snapshot' || 'scrape regular') || format('{0} {1}', github.event.inputs.phase || 'scrape', github.event.inputs.tz_group || 'ALL')) }}

on:
  # Primary scheduling is owned by .github/workflows/box-office-scheduler.yml,
  # which dispatches this workflow with explicit tz_group + phase inputs using
  # GitHub's short-lived workflow token. The VPS cron runs the same scheduler
  # code as a watchdog fallback and only dispatches if the primary scheduler
  # missed a slot after a grace window.
  #
  # Runner topology:
  #   - Phase 1 (collect-links): GH-hosted ubuntu-latest. The global AMC lock
  #     serializes the shared showtime-links.json writer, and each job re-syncs
  #     main after acquiring that lock before extending the shared cache.
  #   - Phase 2 (scrape): GH-hosted ubuntu-latest with matrix [ET,CT,PT],
  #     serialized by the AMC lock so only one AMC browser session is active.
  #     Each leg gets a fresh Azure IP, then uploads a data artifact instead of
  #     pushing to main. This keeps any collected rows durable even if a leg
  #     fails after scraping.
  #   - finalize (artifact merge + predict + xlsx): GH-hosted, single writer.
  #   - Calibrate: self-hosted VPS (weekly, unchanged).
  workflow_dispatch:
    inputs:
      tz_group:
        description: 'Timezone group (ET, CT, PT, or ALL). For phase=scrape this is ignored — the matrix always fans out to ET/CT/PT (MT intentionally omitted).'
        required: false
        default: 'ALL'
      phase:
        description: 'Phase to run: collect-links (Phase 1), scrape (Phase 2), scrape-fandango (Regal/Cinemark snapshot lane), scrape-cinemark (Cinemark DIRECT lane), probe-chains (read-only feasibility probe), or calibrate'
        required: false
        default: 'scrape'
      force:
        description: 'Force Phase 2 even if showtime-links.json is stale (>12h old)'
        required: false
        default: 'false'
      test:
        description: 'Test mode: run Phase 2 on N theatres only per TZ (e.g. 5). Empty = full run.'
        required: false
        default: ''
      pre_reservation_snapshots:
        description: 'Also write reserved-seat snapshot rows to pre-reservation-snapshots.csv. Default off.'
        required: false
        default: 'false'
      snapshots_only:
        description: 'Write pre-reservation snapshots without appending prediction seat-count rows. Default off.'
        required: false
        default: 'false'
      schedule_slot:
        description: 'Internal scheduler slot id. Empty for manual dispatches.'
        required: false
        default: ''
      schedule_mode:
        description: 'Internal scheduler mode: primary or watchdog. Empty for manual dispatches.'
        required: false
        default: ''
      fandango_titles:
        description: 'Fandango ad-hoc test only: comma-separated movie titles to capture (empty = tracked titles).'
        required: false
        default: ''
      fandango_show_dates:
        description: 'Fandango ad-hoc test only: comma-separated YYYY-MM-DD dates to capture instead of the opening-weekend window. Setting this makes scrape-fandango a throwaway test — it writes to an uploaded artifact and does NOT commit canonical data.'
        required: false
        default: ''
      fandango_zips:
        description: 'Fandango ad-hoc test only: comma-separated ZIPs to restrict the theatre pool (for per-IP vs per-range sharding experiments).'
        required: false
        default: ''
      fandango_max_theatres:
        description: 'Fandango ad-hoc test only: cap theatres visited (0 = whole pool).'
        required: false
        default: ''
      fandango_concurrency:
        description: 'Fandango ad-hoc test only: parallel browsers (default 3).'
        required: false
        default: ''
      fandango_per_theatre_cap:
        description: 'Fandango ad-hoc test only: showtimes per theatre (default 3).'
        required: false
        default: ''
      fandango_shard:
        description: 'Fandango: this run scrapes theatres[shard::num_shards] (scheduler sets it per slot; default 0).'
        required: false
        default: ''
      fandango_num_shards:
        description: 'Fandango: total shards across the night (0 = whole pool in one run).'
        required: false
        default: ''
      fandango_order:
        description: 'Fandango showtime pick order: prime (default) or nearest (near-showtime afternoon slots).'
        required: false
        default: ''
      cinemark_discover:
        description: 'scrape-cinemark: true = crawl the sitemap into theatres-cinemark.json instead of collecting.'
        required: false
        default: 'false'
      cinemark_max_theatres:
        description: 'scrape-cinemark: cap theatres visited (validation runs). Empty = whole pool.'
        required: false
        default: ''
      cinemark_show_dates:
        description: 'scrape-cinemark ad-hoc test: capture these YYYY-MM-DD dates; makes the run a throwaway (artifact CSV, no canonical commit).'
        required: false
        default: ''
      cinemark_titles:
        description: 'scrape-cinemark ad-hoc test: comma-separated titles (empty = tracked).'
        required: false
        default: ''
      cinemark_mode:
        description: 'scrape-cinemark: pre (default, pre-reservation snapshots) or post (day-of finals census — shows already started).'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

# Workflow-level concurrency keyed on phase, with one important wrinkle:
# collect-links also includes tz_group. GitHub Actions keeps at most one pending
# run per concurrency group, so a single shared collect-links group can cancel an
# earlier queued ET/CT/PT slot. Per-TZ collect groups preserve all timezone slots;
# the global AMC lock serializes actual execution and shared-cache writes.
#
# For Phase 2, GitHub Actions concurrency groups apply across workflow runs, not
# across matrix legs within one run. The matrix therefore also sets
# max-parallel: 1, and every AMC-touching leg acquires the remote AMC lock.
#
# Scrape runs split into regular vs snapshot lanes. GitHub keeps only one
# pending run per concurrency group, so pre-reservation probes must not share
# the same pending slot as the model-driving post-show scrape.
concurrency:
  # Snapshot dispatches are additionally keyed by schedule_slot: GitHub keeps
  # ONE pending run per group, so with a shared 'snapshot' group a slow 02:30Z
  # run left the queued 14:30Z retry to be CANCELLED by the 22:30Z dispatch —
  # the retries added for the queue-wall incident were most likely to vanish
  # under exactly the degraded conditions they exist for (audit finding). The
  # AMC lock, not the concurrency group, is the execution serializer.
  group: box-office-pipeline-${{ github.event.inputs.phase }}-${{ github.event.inputs.phase == 'collect-links' && github.event.inputs.tz_group || (github.event.inputs.phase == 'scrape' && github.event.inputs.snapshots_only == 'true' && format('snapshot-{0}', github.event.inputs.schedule_slot || 'adhoc') || 'regular') }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Phase 1 — collect showtime links. Runs on GitHub-hosted infrastructure so
  # Phase 1 is independent of VPS runner health and gets a fresh outbound IP.
  # showtime-links.json is shared state, so every job acquires the global AMC
  # lock and re-syncs main after acquisition before it starts collecting.
  # ──────────────────────────────────────────────────────────────────────────
  collect-links:
    if: github.event.inputs.phase == 'collect-links'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50   # dedup guard greps today's commits

      - name: Sync to latest main
        run: |
          git fetch --deepen=50 origin main
          git reset --hard origin/main

      - name: Dedup guard — skip if today's collect-links already committed
        id: dedup
        env:
          # Must match the Phase 1 step below — the guard falls back to a
          # 0.80 module default and would skip retry slots on links the
          # scraper itself deems insufficient.
          PHASE1_MIN_FRESH_LINK_RATIO: '0.90'
        run: |
          python3 box-office-tracker/scripts/collect_links_dedup_guard.py \
            --tz "${{ github.event.inputs.tz_group }}" \
            --force "${{ github.event.inputs.force }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.dedup.outputs.skip != 'true'
        working-directory: box-office-tracker
        run: |
          pip3 install -r requirements.txt
          python3 -m playwright install chromium --with-deps || python3 -m playwright install chromium

      - name: Acquire AMC lock
        id: amc_lock
        if: steps.dedup.outputs.skip != 'true'
        # The 3600s wait is the MAXIMUM the job budget allows (wait + 250m
        # Phase 1 + 50m buffers = exactly the 360m cap, pinned by
        # test_amc_lock_wait_budget_fits_job_timeouts). Thursday contention
        # with the 14:30Z snapshot slot (audit finding) is handled by the
        # scheduler's failed-slot retry instead: a timed-out acquire is a RED
        # run now, re-dispatched within ~30 minutes — better than a longer
        # blocking wait the budget cannot afford.
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 box-office-tracker/scripts/amc_lock.py acquire \
            --mode "collect-links-${{ github.event.inputs.tz_group }}" \
            --wait-seconds 3600 \
            --poll-seconds 60 \
            --github-output "$GITHUB_OUTPUT"

      - name: Re-sync shared Phase 1 cache after lock acquisition
        if: steps.dedup.outputs.skip != 'true' && steps.amc_lock.outputs.acquired == 'true'
        run: |
          # Other timezone jobs may have committed showtime-links.json while
          # this job waited for the lock. Always extend the newest canonical
          # cache instead of overwriting it from a stale checkout.
          git fetch origin main
          git reset --hard origin/main

      - name: Phase 1 — collect showtime links (${{ github.event.inputs.tz_group }})
        if: steps.dedup.outputs.skip != 'true' && steps.amc_lock.outputs.acquired == 'true'
        working-directory: box-office-tracker
        timeout-minutes: 250
        env:
          PHASE1_FULL_WEEKEND_LINKS: 'true'
          PHASE1_DEADLINE_SEC: '7200'
          PHASE1_MIN_FRESH_LINK_RATIO: '0.90'
          PHASE1_MAX_THEATRE_DATE_VISITS: '2000'
        run: |
          set +e
          mkdir -p ../phase1-logs
          python3 scraper.py --collect-links ${{ github.event.inputs.tz_group }} 2>&1 | tee "../phase1-logs/phase1-${{ github.event.inputs.tz_group }}-attempt1.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Phase 1 failed coverage/runtime check; waiting 180s and retrying once under the same AMC lock."
            sleep 180
            python3 scraper.py --collect-links ${{ github.event.inputs.tz_group }} 2>&1 | tee "../phase1-logs/phase1-${{ github.event.inputs.tz_group }}-attempt2.log"
            status=${PIPESTATUS[0]}
          fi
          exit "$status"

      - name: Commit showtime links
        # Commit on failure too: the scraper saves the merged link cache
        # (atomically, marked degraded) BEFORE its coverage gate, so a red
        # Phase 1 still leaves partial links worth publishing — the merge is
        # a monotonic union and the dedup guard never skips on a degraded
        # cache, so retry slots keep re-collecting until the bar is met.
        # "!cancelled()": a stop button must not publish. Commit while still
        # holding the AMC lock so the next timezone cannot re-sync a stale
        # shared cache before this timezone's canonical links reach main.
        if: "!cancelled() && steps.dedup.outputs.skip != 'true' && steps.amc_lock.outputs.acquired == 'true'"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only stage the files Phase 1 actually writes. A blanket
          # `git add box-office-tracker/` would sweep up any stray untracked
          # files (e.g. runner caches, locally-modified secrets).
          git add box-office-tracker/data/showtime-links.json
          git add box-office-tracker/data/theatre-counts.json
          if [ -f "box-office-tracker/data/polymarket-markets.csv" ]; then
            git add box-office-tracker/data/polymarket-markets.csv
          fi
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: box office ${{ github.event.inputs.tz_group }} collect-links"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            if [ "$i" = "3" ]; then
              echo "All 3 push attempts failed — data not committed."
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            sleep $((i * 15))
          done

      - name: Release AMC lock
        if: always() && steps.amc_lock.outputs.acquired == 'true'
        run: |
          python3 box-office-tracker/scripts/amc_lock.py release \
            --lock-sha "${{ steps.amc_lock.outputs.lock_sha }}"

      - name: Upload Phase 1 logs
        if: always() && steps.dedup.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase1-logs-${{ github.event.inputs.tz_group }}-${{ github.run_id }}
          path: phase1-logs/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # Phase 2 — seat data scrape. Runs on ubuntu-latest matrix so each TZ gets
  # a fresh Azure IP, defeating AMC's Queue-It IP-flagging that had been
  # zeroing out CT/PT on the VPS IP. The matrix is intentionally serialized:
  # strict-zero AMC overlap is more important than scrape speed.
  #
  # Each matrix leg uploads its local CSV/log snapshot as an artifact and never
  # pushes to main. The finalize job is the only Phase 2 writer; it downloads all
  # scrape artifacts, dedupes rows, regenerates derived files, and commits once.
  # This removes the race that can strand rows behind a dirty worktree or failed
  # rebase while preserving partial data from crashed scrape legs.
  # ──────────────────────────────────────────────────────────────────────────
  scrape:
    if: github.event.inputs.phase == 'scrape'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false   # one TZ's Queue-It or timeout shouldn't cancel the others
      max-parallel: 1
      matrix:
        tz: [ET, CT, PT]   # MT intentionally omitted — too few theatres to be worth the Phase 1 schedule

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: Sync to latest main
        # Reset to current main before scraping so each artifact starts from the
        # newest committed baseline. The finalizer will dedupe any overlapping
        # rows from parallel legs.
        run: |
          git fetch --deepen=50 origin main
          git reset --hard origin/main

      - name: Dedup guard — skip if ${{ matrix.tz }} already scraped today
        id: dedup
        run: |
          python3 box-office-tracker/scripts/scrape_dedup_guard.py \
            --tz "${{ matrix.tz }}" \
            --force "${{ github.event.inputs.force }}" \
            --snapshots-only "${{ github.event.inputs.snapshots_only }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.dedup.outputs.skip != 'true'
        working-directory: box-office-tracker
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Acquire AMC lock
        id: amc_lock
        if: steps.dedup.outputs.skip != 'true'
        timeout-minutes: 130
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lane="regular"
          if [ "${{ github.event.inputs.snapshots_only }}" = "true" ]; then
            lane="snapshot"
          fi
          python3 box-office-tracker/scripts/amc_lock.py acquire \
            --mode "scrape-${lane}-${{ matrix.tz }}" \
            --wait-seconds 7200 \
            --poll-seconds 60 \
            --github-output "$GITHUB_OUTPUT"

      - name: Phase 2 — collect seat data (${{ matrix.tz }})
        if: steps.dedup.outputs.skip != 'true'
        working-directory: box-office-tracker
        timeout-minutes: 190
        run: |
          export PHASE1_MIN_FRESH_LINK_RATIO=0.90
          if [ "${{ github.event.inputs.snapshots_only }}" = "true" ]; then
            export SNAPSHOT_MAX_CONCURRENT_TABS=3
            # 200 theatres ≈ 2x the sellout/demand-velocity sample (measured
            # ~1.6s/row ≈ 5,600 rows in the 9000s deadline — Thu-Sun probes fit
            # fully; only the low-value Mon-Wed long-lead probes may truncate,
            # and demand-first ordering drops the least-informative tail).
            # Budget chain: lock wait 120m + step 190m + 50m buffers = 360m job cap,
            # so the extra room comes from the repair budget (2700 -> 1800), not
            # the step timeout.
            export SNAPSHOT_TOP_THEATRE_CAP=200
            export SNAPSHOT_REPAIR_LINKS=1
            export PHASE2_DEADLINE_SEC=9000
            export PHASE1_DEADLINE_SEC=1800
            export PHASE1_MAX_THEATRE_DATE_VISITS=500
            export SNAPSHOT_MIN_THEATRE_COVERAGE_RATIO=0.80
            echo "Snapshot lane: top theatres=$SNAPSHOT_TOP_THEATRE_CAP max tabs=$SNAPSHOT_MAX_CONCURRENT_TABS deadline=${PHASE2_DEADLINE_SEC}s targeted-link-repair=on"
          else
            export PHASE2_THEATRE_TIMEOUT_SEC=180
            export PHASE1_DEADLINE_SEC=2400
            export PHASE1_MAX_THEATRE_DATE_VISITS=500
            export REGULAR_PHASE2_MIN_DEADLINE_SEC=9000
            export REGULAR_PHASE2_MAX_DEADLINE_SEC=10800
            export REGULAR_PHASE2_MIN_COVERAGE_RATIO=0.90
            echo "Regular lane: deadline floor=${REGULAR_PHASE2_MIN_DEADLINE_SEC}s cap=${REGULAR_PHASE2_MAX_DEADLINE_SEC}s theatre-timeout=${PHASE2_THEATRE_TIMEOUT_SEC}s phase1-repair-budget=${PHASE1_DEADLINE_SEC}s"
          fi
          # Default-off: only pass --force when the input is explicitly "true".
          # Matches the workflow_dispatch input default of 'false' and the VPS
          # dispatch.sh default, so an empty/missing input can't silently
          # bypass the 12h staleness guard on showtime-links.json.
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          TEST_FLAG=""
          if [ -n "${{ github.event.inputs.test }}" ]; then TEST_FLAG="--test ${{ github.event.inputs.test }}"; fi
          SNAPSHOT_FLAG=""
          if [ "${{ github.event.inputs.pre_reservation_snapshots }}" = "true" ]; then
            SNAPSHOT_FLAG="--pre-reservation-snapshots"
          fi
          if [ "${{ github.event.inputs.snapshots_only }}" = "true" ]; then
            SNAPSHOT_FLAG="$SNAPSHOT_FLAG --snapshots-only"
          fi
          SNAPSHOT_REPAIR_FLAG=""
          if [ "${{ github.event.inputs.snapshots_only }}" = "true" ]; then
            SNAPSHOT_REPAIR_FLAG="--repair-snapshot-links"
          fi
          ENSURE_LINKS_FLAG="--ensure-links"
          if [ "${{ github.event.inputs.snapshots_only }}" = "true" ]; then
            ENSURE_LINKS_FLAG=""
          fi
          python scraper.py $FORCE_FLAG $TEST_FLAG $SNAPSHOT_FLAG $SNAPSHOT_REPAIR_FLAG $ENSURE_LINKS_FLAG ${{ matrix.tz }}

      - name: Release AMC lock
        if: always() && steps.amc_lock.outputs.acquired == 'true'
        run: |
          python3 box-office-tracker/scripts/amc_lock.py release \
            --lock-sha "${{ steps.amc_lock.outputs.lock_sha }}"

      - name: Write scrape manifest
        if: always()
        run: |
          mkdir -p box-office-tracker/data/scrape-manifest
          {
            echo "timezone=${{ matrix.tz }}"
            echo "dedup_skip=${{ steps.dedup.outputs.skip }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "workflow_job_status=${{ job.status }}"
            echo "snapshots_only=${{ github.event.inputs.snapshots_only }}"
            echo "pre_reservation_snapshots=${{ github.event.inputs.pre_reservation_snapshots }}"
          } > box-office-tracker/data/scrape-manifest/${{ matrix.tz }}.env

      - name: Upload scrape artifact
        # always() so partial data from a crashed scrape still reaches the
        # single-writer finalizer. The scraper flushes per-theatre, so even a
        # mid-run failure can have rows worth merging.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ matrix.tz }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            box-office-tracker/data/scrape-manifest/${{ matrix.tz }}.env
            box-office-tracker/data/scrape-manifest/${{ matrix.tz }}-snapshot-fatal.marker
            box-office-tracker/data/seat-counts.csv
            box-office-tracker/data/pre-reservation-snapshots.csv
            box-office-tracker/data/polymarket-markets.csv
            box-office-tracker/data/run-logs/
            box-office-tracker/data/showtime-links.json
            box-office-tracker/data/theatre-counts.json

  # ──────────────────────────────────────────────────────────────────────────
  # Finalize — runs once after all matrix legs finish. Regenerates
  # predictions and xlsx from the fully-merged CSV. A single writer here
  # means no race on these derived artifacts.
  # ──────────────────────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────────────────────
  # probe-chains — read-only feasibility probe of Regal/Cinemark DIRECT sites
  # (Phase C scaling: the Fandango lane is capped by a per-Azure-range seat
  # budget; the chains' own sites are independent rate-limit domains). Runs a
  # handful of page loads from a US runner, captures which JSON endpoints the
  # theatre pages call, and uploads the report as an artifact. Never commits.
  # ──────────────────────────────────────────────────────────────────────────
  probe-chains:
    if: github.event.inputs.phase == 'probe-chains'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: box-office-tracker
        run: |
          pip install requests playwright
          python -m playwright install chromium --with-deps

      - name: Probe chain sites
        working-directory: box-office-tracker
        run: |
          set +e
          mkdir -p ../chain-probe
          # Current probe-lane payload: Regal-pool expansion discovery
          # (~350-zip national grid + widened Edwards/UA brand detection).
          # Artifact-only; the expanded pool is reviewed and committed locally.
          timeout 1500 python -u scripts/fandango_discover.py 2>&1 | tee ../chain-probe/fandango-discover.log
          exit 0

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-probe-${{ github.run_id }}
          path: chain-probe/
          retention-days: 14

  finalize:
    needs: scrape
    # Run regardless of how the individual matrix legs ended (always()), and
    # skip only if scrape never ran at all (phase != scrape).
    # 'cancelled' is deliberately EXCLUDED. It was briefly included to stop a
    # cancel orphaning uploaded artifacts, but that reasoning was wrong: this
    # workflow sets cancel-in-progress: false, so concurrency never cancels a
    # RUNNING leg — only pending runs, which produce no artifacts. The only
    # real path is a MANUAL cancel, and an operator cancelling a bad run must
    # not have finalize proceed to merge, clean, rotate and push to main
    # anyway. Cancel stays a stop button on the one job that writes canonical
    # data; losing that run's artifacts is the intended cost.
    if: >
      always() &&
      github.event.inputs.phase == 'scrape' &&
      (needs.scrape.result == 'success' || needs.scrape.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: Sync to latest main
        # Finalize is the single Phase 2 writer. Start from current main, then
        # merge the downloaded matrix artifacts into canonical data files.
        run: |
          git fetch --deepen=50 origin main
          git reset --hard origin/main

      - name: Download scrape artifacts
        id: download_scrape_artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scrape-*
          path: box-office-tracker/data/scrape-artifacts

      - name: Merge scrape artifacts
        working-directory: box-office-tracker
        run: |
          python scripts/merge_scrape_artifacts.py data/scrape-artifacts \
            --marker-file /tmp/box-office-scrape-markers.txt \
            --summary-file /tmp/box-office-merge-summary.json

      - name: Capture completeness watchdog (informational)
        working-directory: box-office-tracker
        # Every silent-loss incident shared one shape: lanes exited 0 while
        # producing no rows, and nothing watched output volume. This compares
        # the current weekend's per-day per-lane row counts against the median
        # of settled weekends and emits ::warning:: on gaps. ALWAYS exits 0 —
        # a watchdog that can brick finalize would repeat the
        # clean_canonical_data incident.
        # No continue-on-error: the script always exits 0 by design, so the
        # only way this step fails is the watchdog itself crashing — and a
        # dead watchdog swallowed by continue-on-error could stay dead for
        # weeks (nothing watches the watchdog). The || arm keeps finalize
        # green while making the crash an ::error:: annotation.
        run: python3 scripts/capture_completeness.py || echo "::error::capture_completeness watchdog CRASHED — the green-but-empty net is down; fix it"

      - name: Slot ledger (informational)
        working-directory: box-office-tracker
        # Every other monitor watches RUNS; a slot neither dispatch layer
        # ever fired (GitHub cron gap >75min while the VPS watchdog is down)
        # left zero trace. Recompute yesterday's expected slots from the
        # schedulers' own table and warn on any with no run at all. Same
        # crash-surfacing shape as the watchdog above: the script always
        # exits 0, so a step failure means the ledger itself died.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/schedule_box_office_pipeline.py --reconcile yesterday || echo "::error::slot ledger CRASHED — missed-slot detection is down; fix it"

      - name: Clean canonical training data
        working-directory: box-office-tracker
        run: python scripts/clean_canonical_data.py --repo-root "$GITHUB_WORKSPACE"

      - name: Size safety net — rotate settled weekends if a canonical CSV is large
        working-directory: box-office-tracker
        run: |
          # Rotation normally runs in the weekly `calibrate` job, which is
          # runs-on: [self-hosted, vps]. A single droplet is a single point of
          # failure: if it is offline, rotation silently stops, the live CSVs
          # grow ~25MB/weekend and eventually cross GitHub's 100MB push limit —
          # which is exactly what bricked the snapshot lane on 2026-07-12. This
          # net runs on ubuntu-latest, so the cliff cannot come back while the
          # VPS is down. Well below the limit it is a no-op.
          limit=$((60 * 1024 * 1024))
          need=0
          for f in data/seat-counts.csv data/pre-reservation-snapshots.csv; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            echo "$f: $((size / 1024 / 1024))MB"
            [ "$size" -gt "$limit" ] && need=1
          done
          if [ "$need" = "1" ]; then
            echo "::warning::A canonical CSV passed 60MB — rotating settled weekends here because the weekly VPS rotation has not kept up."
            python3 scripts/rotate_pre_reservation_snapshots.py
          else
            echo "Both canonical CSVs are comfortably under the limit; no rotation needed."
          fi

      - name: Finalize guard — skip if latest scrape already has derived artifacts
        id: finalize_guard
        run: |
          row_changes=$(python3 -c 'import json; s=json.load(open("/tmp/box-office-merge-summary.json")); print(sum(int(s.get(k, 0) or 0) for k in ("seat_added", "seat_metadata_updated", "pre_reservation_added", "polymarket_added")))')
          canonical_status="$(git status --short -- \
            box-office-tracker/data/seat-counts.csv \
            box-office-tracker/data/pre-reservation-snapshots.csv \
            box-office-tracker/data/polymarket-markets.csv \
            box-office-tracker/data/calibration.json \
            box-office-tracker/data/calibration-freezes \
            box-office-tracker/data/run-logs)"
          if [ -z "$canonical_status" ]; then
            if [ "$row_changes" -eq 0 ]; then
              echo "No canonical seat, snapshot, market rows, or seat metadata were merged; skipping finalize."
            else
              echo "Merged rows were duplicate or cleaned away; no net canonical data changes."
            fi
            # STALENESS LABEL (audit finding): skipping finalize means the
            # committed predictions/xlsx stay as they were — but nothing said
            # so, and a reader of the repo saw stale forecasts presented as
            # current. Say when they were last actually regenerated.
            last_pred=$(git log -1 --format="%cI" -- box-office-tracker/data/seat-counts.xlsx 2>/dev/null || true)
            [ -z "$last_pred" ] && last_pred="unknown (no regeneration within the shallow fetch window)" 
            echo "::notice::finalize skipped — predictions/xlsx NOT regenerated this run; last regeneration was $last_pred"
            echo "needs_finalize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Merged or cleaned scrape artifacts changed canonical data; finalize required."
          echo "$canonical_status"
          echo "needs_finalize=true" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install dependencies
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        working-directory: box-office-tracker
        run: |
          pip install -r requirements.txt
          # No playwright needed here — predict.py and export_seat_counts_xlsx.py
          # are pure-pandas. Skipping the chromium download saves ~2 min.

      - name: Auto-fetch review scores
        # Word-of-mouth layer: pull this weekend's films' Rotten Tomatoes
        # audience/critic scores into data/reviews.csv before predicting. Best
        # effort — a fetch miss leaves the review layer neutral, so it must not
        # fail finalize.
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        working-directory: box-office-tracker
        continue-on-error: true
        run: python scripts/import_reviews.py

      - name: Auto-fetch reported daily actuals
        # Same-week anchor input: The Numbers publishes each day's grosses the
        # next morning. A reported SATURDAY actual lets the already-built
        # same-week share/scale anchors correct the AMC-to-national divisor
        # for the Sunday forecast (tested on 2026-08-28: both films improved).
        # Friday numbers are deliberately NOT emitted — previews fold into
        # them mid-weekend and Friday's share is the weekend's low outlier;
        # both films got WORSE with a Friday anchor (see
        # scripts/fetch_daily_actuals.py SAFE_ANCHOR_DAYS). Best effort — a
        # fetch miss leaves the anchors unset, never fails finalize.
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        working-directory: box-office-tracker
        continue-on-error: true
        run: python scripts/fetch_daily_actuals.py

      - name: Auto-fetch Wikipedia anticipation (diagnostic)
        # Word-of-mouth DIAGNOSTIC only: release-week Wikipedia pageviews are a
        # leak-free anticipation signal, but the backtest showed they're
        # redundant with the Thursday seat read (LOO MAE 21.6%->21.8%), so they
        # render as a social-signal context card and DO NOT move the headline.
        # Best effort — never fail finalize.
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        working-directory: box-office-tracker
        continue-on-error: true
        run: python scripts/import_wiki_pageviews.py

      - name: Generate predictions
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        working-directory: box-office-tracker
        run: python predict.py

      - name: Refresh Excel workbook
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        working-directory: box-office-tracker
        run: python export_seat_counts_xlsx.py

      - name: Commit merged scrape data + predictions
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Explicit allow-list: commit canonical merged data and derived files,
          # never the downloaded artifact staging directory.
          python box-office-tracker/scripts/stage_finalize_outputs.py \
            --summary-file /tmp/box-office-merge-summary.json \
            --marker-file /tmp/box-office-scrape-markers.txt
          if git diff --staged --quiet; then
            echo "No canonical data or derived artifacts changed."
            exit 0
          fi
          commit_msg=/tmp/box-office-finalize-commit.txt
          printf "data: box office scrape merge + predictions\n\n" > "$commit_msg"
          if [ -s /tmp/box-office-scrape-markers.txt ]; then
            cat /tmp/box-office-scrape-markers.txt >> "$commit_msg"
          fi
          git commit -F "$commit_msg"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            if [ "$i" = "3" ]; then
              echo "All 3 push attempts failed — derived artifacts not committed."
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            sleep $((i * 15))
          done

  # ──────────────────────────────────────────────────────────────────────────
  # Fandango snapshot lane — Regal/Cinemark pre-reservation seat data via
  # Fandango. ISOLATED from the AMC pipeline (writes ONLY the separate
  # data/fandango-pre-reservation-snapshots.csv; the AMC CSVs are untouched).
  #
  # SHARDED TIME-SPREAD: Fandango's seat limit is a per-Azure-RANGE budget of
  # ~70-80 captures per ~1-hour window — fanning out across IPs (concurrent OR
  # rapid-sequential) does NOT beat it (tested: 8 shards → only ~55-70 rows
  # total). But the limit RECOVERS in ~1 hour, so we run ONE capped shard per
  # scheduled slot and space the slots ~1 h apart across the opening-weekend
  # night; each slot takes a different shard (theatres[shard::N]) so the N slots
  # together cover all ~320 theatres in one night. Each run is a single fresh IP
  # scraping ~1/N of the pool (cap 1), comfortably under the per-window budget,
  # and commits its shard directly — slots never overlap, so no commit race.
  # Gated OUT of the model until Phase C.
  # ──────────────────────────────────────────────────────────────────────────
  scrape-fandango:
    if: github.event.inputs.phase == 'scrape-fandango'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: Sync to latest main
        run: |
          git fetch --deepen=50 origin main
          git reset --hard origin/main

      - name: Install dependencies
        working-directory: box-office-tracker
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Fandango snapshot — collect shard ${{ github.event.inputs.fandango_shard || '0' }}
        working-directory: box-office-tracker
        timeout-minutes: 40
        env:
          # Scheduled slots pass shard + num_shards; ad-hoc runs default to the whole pool.
          FANDANGO_SHARD: ${{ github.event.inputs.fandango_shard != '' && github.event.inputs.fandango_shard || '0' }}
          FANDANGO_NUM_SHARDS: ${{ github.event.inputs.fandango_num_shards != '' && github.event.inputs.fandango_num_shards || '0' }}
          FANDANGO_ORDER: ${{ github.event.inputs.fandango_order != '' && github.event.inputs.fandango_order || 'prime' }}
          FANDANGO_CONCURRENCY: ${{ github.event.inputs.fandango_concurrency != '' && github.event.inputs.fandango_concurrency || '2' }}
          # cap=1 with the EXPANDED Regal-only pool (380 theatres since the
          # 2026-08-31 two-round discovery): 380/6 shards = 63-64 theatres,
          # OVER the ~55-render budget the per-Azure-range limit has tolerated
          # for months (~53). Scheduled (sharded) runs therefore cap at 55
          # theatres/run below; shard -> shuffle -> cap order means each run
          # samples a rotating random 55 of its shard, and the three daily
          # reads per shard cover the remainder. The volume gain is BREADTH —
          # not per-theatre depth; cap=2 here would double renders/slot and
          # throttle the tails.
          FANDANGO_PER_THEATRE_CAP: ${{ github.event.inputs.fandango_per_theatre_cap != '' && github.event.inputs.fandango_per_theatre_cap || '1' }}
          FANDANGO_DEADLINE_SEC: '2100'   # 35 min — self-stop with margin under the 40-min step timeout
          # Ad-hoc test overrides (empty on scheduled/production runs):
          FANDANGO_TITLES: ${{ github.event.inputs.fandango_titles }}
          FANDANGO_SHOW_DATES: ${{ github.event.inputs.fandango_show_dates }}
          FANDANGO_ZIPS: ${{ github.event.inputs.fandango_zips }}
          # Sharded (scheduled) runs cap at 55 renders — the proven per-slot
          # budget; ad-hoc unsharded runs keep whole-pool semantics.
          FANDANGO_MAX_THEATRES: ${{ github.event.inputs.fandango_max_theatres != '' && github.event.inputs.fandango_max_theatres || (github.event.inputs.fandango_num_shards != '' && '55' || '') }}
          # Test runs (show_dates set) write to a throwaway file, never canonical.
          FANDANGO_OUTPUT: ${{ github.event.inputs.fandango_show_dates != '' && '../fandango-logs/fandango-test-capture.csv' || '' }}
        run: |
          set +e
          mkdir -p ../fandango-logs
          # tee must not mask the collector's exit code: fandango_collect exits 1
          # when tracked titles yielded zero rows (green-zero guard). Without
          # PIPESTATUS the step took tee's status (always 0), so a zero-row run
          # concluded success and the scheduler's retry/circuit-breaker never
          # engaged. Mirror the Phase 1 step.
          python fandango_collect.py 2>&1 | tee "../fandango-logs/fandango-${{ github.run_id }}.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Commit Fandango snapshot data
        # always() so partial rows from a timed-out/failed collect still commit
        # (the collector flushes per-theatre); skip only on ad-hoc test runs,
        # which write to a throwaway file.
        if: always() && github.event.inputs.fandango_show_dates == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Isolated single file — never sweep up other untracked files. Guard the
          # add: a no-op run (no rows) never creates the file, and `git add` of a
          # missing pathspec would fail the step under `set -e`.
          # NO concurrent-commit race: all scrape-fandango runs share one workflow
          # concurrency group (cancel-in-progress: false), so a run fully finishes
          # (incl. push) before the next starts, and the rebase loop only replays
          # onto unrelated AMC commits (different files → no conflict).
          # `-X ours` was REMOVED here and in every other push loop: during a
          # REBASE `ours` is upstream, so a conflicting hunk kept origin/main and
          # silently dropped the commit being replayed. Live loss on 2026-08-07 —
          # the CT collect-links leg committed 9,196 insertions and the rebase
          # reported `dropping <sha> -- patch contents already upstream`, then
          # exited 0. Without the strategy option a genuine conflict stops the
          # rebase, the retry loop runs, and a persistent conflict fails the step
          # loudly instead of reporting success over lost data.
          fandango_csv=box-office-tracker/data/fandango-pre-reservation-snapshots.csv
          if [ -f "$fandango_csv" ]; then
            git add "$fandango_csv"
          fi
          if git diff --staged --quiet; then
            echo "No Fandango snapshot rows to commit."
            exit 0
          fi
          git commit -m "data: box office fandango snapshot (shard ${{ github.event.inputs.fandango_shard || '0' }})"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            if [ "$i" = "3" ]; then
              echo "All 3 push attempts failed — Fandango data not committed."
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            sleep $((i * 15))
          done

      - name: Upload Fandango logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fandango-logs-${{ github.run_id }}
          path: fandango-logs/
          if-no-files-found: ignore
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Calibrate — dispatched by the scheduler after actuals have time to post.
  # Stays on VPS; doesn't hit AMC.
  # ──────────────────────────────────────────────────────────────────────────
  calibrate:
    if: github.event.inputs.phase == 'calibrate'
    runs-on: [self-hosted, vps]
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false
          fetch-depth: 50

      - name: Sync to latest main
        run: |
          git fetch --deepen=50 origin main
          git reset --hard origin/main

      - name: Install dependencies
        working-directory: box-office-tracker
        run: pip3 install -r requirements.txt

      - name: Auto-calibrate
        working-directory: box-office-tracker
        run: python3 calibrate.py

      - name: Share-truth audit (informational)
        # Measures each recorded film's ground-truth AMC share (seats sold per
        # national dollar) against the fleet prior — the largest open error
        # channel per the 2026-08-28 post-mortem. Warn-only, never fails.
        working-directory: box-office-tracker
        run: python3 scripts/share_truth_audit.py || echo "::warning::share_truth_audit crashed — the share-error monitor is down"

      - name: Rotate settled pre-reservation snapshots
        # The live snapshot CSV grows ~15-25MB per weekend and GitHub hard-blocks
        # pushes at 100MB (it hit 99MB on 2026-07-12 and killed a finalize push).
        # Move settled weekends into per-weekend gzip archives; the model reads
        # them transparently for historical replays.
        working-directory: box-office-tracker
        run: python3 scripts/rotate_pre_reservation_snapshots.py

      - name: Commit calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # calibrate.py writes calibration.json plus pre-actual calibration
          # freezes used for clean historical replay. Explicit allow-list so a
          # stray untracked file on the VPS runner (e.g. a playwright cache,
          # a locally-edited .env) can't ride along into the commit.
          git add box-office-tracker/data/calibration.json
          git add box-office-tracker/data/pre-reservation-snapshots.csv
          git add box-office-tracker/data/seat-counts.csv
          if compgen -G "box-office-tracker/data/pre-reservation-archive/*.csv.gz" > /dev/null; then
            git add box-office-tracker/data/pre-reservation-archive/*.csv.gz
          fi
          if compgen -G "box-office-tracker/data/seat-archive/*.csv.gz" > /dev/null; then
            git add box-office-tracker/data/seat-archive/*.csv.gz
          fi
          if compgen -G "box-office-tracker/data/calibration-freezes/*.json" > /dev/null; then
            git add box-office-tracker/data/calibration-freezes/*.json
          else
            echo "No calibration freeze files to stage."
          fi
          if git diff --staged --quiet; then
            echo "No calibration changes."
            exit 0
          fi
          git commit -m "data: box office calibration"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            if [ "$i" = "3" ]; then
              echo "All 3 push attempts failed — calibration not committed."
              # calibrate is the only job on the persistent VPS runner
              # (clean: false). Without this, a conflict leaves
              # .git/rebase-merge behind and the next run's `git reset --hard`
              # does NOT clear it — the runner stays wedged. The other three
              # push loops already abort here; this one was the odd one out,
              # harmless only while `-X ours` guaranteed the rebase never
              # stopped.
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            sleep $((i * 15))
          done

  # ──────────────────────────────────────────────────────────────────────────
  # scrape-cinemark — Cinemark DIRECT pre-reservation lane (split-lane Phase C
  # scaling; see cinemark_collect.py docstring). Manual dispatch only until
  # validated — no scheduler slots yet. Writes ONLY its own isolated CSV.
  # ──────────────────────────────────────────────────────────────────────────
  scrape-cinemark:
    if: github.event.inputs.phase == 'scrape-cinemark'
    runs-on: ubuntu-latest
    timeout-minutes: 115

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: Sync to latest main
        run: |
          git fetch --deepen=50 origin main
          git reset --hard origin/main

      - name: Install dependencies
        working-directory: box-office-tracker
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Cinemark collect
        working-directory: box-office-tracker
        timeout-minutes: 100
        env:
          CINEMARK_MAX_THEATRES: ${{ github.event.inputs.cinemark_max_theatres }}
          CINEMARK_MODE: ${{ github.event.inputs.cinemark_mode }}
          CINEMARK_TITLES: ${{ github.event.inputs.cinemark_titles }}
          CINEMARK_SHOW_DATES: ${{ github.event.inputs.cinemark_show_dates }}
          # Test runs (show_dates set) write a throwaway CSV, never canonical.
          CINEMARK_OUTPUT: ${{ github.event.inputs.cinemark_show_dates != '' && '../cinemark-logs/cinemark-test-capture.csv' || '' }}
        run: |
          set +e
          mkdir -p ../cinemark-logs
          FLAG=""
          if [ "${{ github.event.inputs.cinemark_discover }}" = "true" ]; then
            FLAG="--discover"
          fi
          # Scheduled/full-pool runs get a 90-min collection budget. At real
          # per-theatre cost (~25-35s, more when the security-verification
          # interstitial fires) that covers ~150-250 of the 306 theatres per
          # pass; the collector shuffles the pool so each pass samples it
          # broadly and the two daily pre passes rotate coverage. The run
          # self-stops cleanly at the deadline; capped ad-hoc tests stay on
          # the snappy 35-min default.
          if [ -z "$CINEMARK_MAX_THEATRES" ]; then
            export CINEMARK_DEADLINE_SEC="${CINEMARK_DEADLINE_SEC:-5400}"
          fi
          # -u + PIPESTATUS: output must survive kills and tee must not mask
          # the exit code (both lessons already paid for in the Fandango lane).
          timeout 5700 python -u cinemark_collect.py $FLAG 2>&1 | tee "../cinemark-logs/cinemark-${{ github.run_id }}.log"
          exit "${PIPESTATUS[0]}"

      - name: Commit Cinemark data
        if: always() && github.event.inputs.cinemark_show_dates == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in box-office-tracker/data/theatres-cinemark.json \
                   box-office-tracker/data/cinemark-pre-reservation-snapshots.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No Cinemark data to commit."
            exit 0
          fi
          git commit -m "data: box office cinemark direct lane"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            [ "$i" = "3" ] && exit 1
            sleep 15
          done

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinemark-${{ github.run_id }}
          path: cinemark-logs/
          retention-days: 14
