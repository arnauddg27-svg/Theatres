name: Box Office Pipeline
run-name: >-
  box office ${{ github.event.inputs.phase == 'scrape' && (github.event.inputs.snapshots_only == 'true' && 'scrape snapshot' || 'scrape regular') || format('{0} {1}', github.event.inputs.phase || 'scrape', github.event.inputs.tz_group || 'ALL') }}

on:
  # Scheduling is driven by a system cron on the self-hosted VPS
  # (/etc/cron.d/box-office-dispatch), which invokes `gh workflow run`
  # with explicit tz_group + phase inputs. GitHub's own `schedule:`
  # trigger was dropping ~30% of slots entirely (notably all PT slots
  # on 2026-04-21), which no matches_slot tolerance can recover from.
  #
  # Runner topology:
  #   - Phase 1 (collect-links): self-hosted VPS — not Queue-It'd, shared
  #     state file showtime-links.json benefits from single-writer serialization.
  #   - Phase 2 (scrape): GH-hosted ubuntu-latest with matrix [ET,CT,PT],
  #     serialized by the AMC lock so only one AMC browser session is active.
  #     Each leg gets a fresh Azure IP, then uploads a data artifact instead of
  #     pushing to main. This keeps any collected rows durable even if a leg
  #     fails after scraping.
  #   - finalize (artifact merge + predict + xlsx): GH-hosted, single writer.
  #   - Calibrate: self-hosted VPS (weekly, unchanged).
  workflow_dispatch:
    inputs:
      tz_group:
        description: 'Timezone group (ET, CT, PT, or ALL). For phase=scrape this is ignored — the matrix always fans out to ET/CT/PT (MT intentionally omitted).'
        required: false
        default: 'ALL'
      phase:
        description: 'Phase to run: collect-links (Phase 1), scrape (Phase 2), or calibrate'
        required: false
        default: 'scrape'
      force:
        description: 'Force Phase 2 even if showtime-links.json is stale (>12h old)'
        required: false
        default: 'false'
      test:
        description: 'Test mode: run Phase 2 on N theatres only per TZ (e.g. 5). Empty = full run.'
        required: false
        default: ''
      pre_reservation_snapshots:
        description: 'Also write reserved-seat snapshot rows to pre-reservation-snapshots.csv. Default off.'
        required: false
        default: 'false'
      snapshots_only:
        description: 'Write pre-reservation snapshots without appending prediction seat-count rows. Default off.'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: read

# Workflow-level concurrency keyed on phase, with one important wrinkle:
# collect-links also includes tz_group. GitHub Actions keeps at most one pending
# run per concurrency group, so a single shared collect-links group can cancel an
# earlier queued ET/CT/PT slot when the VPS runner is busy. Per-TZ collect groups
# preserve all timezone slots; the single self-hosted VPS runner still serializes
# actual execution and avoids parallel writes to showtime-links.json.
#
# For Phase 2, GitHub Actions concurrency groups apply across workflow runs, not
# across matrix legs within one run. The matrix therefore also sets
# max-parallel: 1, and every AMC-touching leg acquires the remote AMC lock.
#
# Scrape runs split into regular vs snapshot lanes. GitHub keeps only one
# pending run per concurrency group, so pre-reservation probes must not share
# the same pending slot as the model-driving post-show scrape.
concurrency:
  group: box-office-pipeline-${{ github.event.inputs.phase }}-${{ github.event.inputs.phase == 'collect-links' && github.event.inputs.tz_group || (github.event.inputs.phase == 'scrape' && github.event.inputs.snapshots_only == 'true' && 'snapshot' || 'regular') }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Phase 1 — collect showtime links. Runs on VPS because (a) it isn't
  # Queue-It'd, so IP rotation buys nothing, and (b) showtime-links.json is
  # shared state — parallel writers would conflict. VPS cron dispatches one
  # TZ at a time (5pm/6pm local), so this job always sees a single TZ.
  # ──────────────────────────────────────────────────────────────────────────
  collect-links:
    if: github.event.inputs.phase == 'collect-links'
    runs-on: [self-hosted, vps]
    timeout-minutes: 500

    steps:
      - name: Free disk space
        run: |
          rm -rf /home/gha/actions-runner/_work/_update 2>/dev/null || true
          rm -rf /home/gha/actions-runner/_work/_temp/* 2>/dev/null || true
          find /home/gha/actions-runner/_diag -maxdepth 1 -type f -name '*.log' -mtime +7 -delete 2>/dev/null || true
          current_ext=$(readlink /home/gha/actions-runner/externals 2>/dev/null | xargs basename 2>/dev/null)
          current_bin=$(readlink /home/gha/actions-runner/bin 2>/dev/null | xargs basename 2>/dev/null)
          if [ -n "$current_ext" ] && [ -n "$current_bin" ]; then
            for d in /home/gha/actions-runner/externals.* /home/gha/actions-runner/bin.*; do
              [ -e "$d" ] || continue
              base=$(basename "$d")
              [ "$base" != "$current_ext" ] && [ "$base" != "$current_bin" ] && rm -rf "$d"
            done
          fi
          pip3 cache purge 2>/dev/null || true
          apt-get clean 2>/dev/null || true
          df -h / | tail -1

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false   # preserve .env and other untracked files between runs
          fetch-depth: 50   # dedup guard greps today's commits

      - name: Sync to latest main
        run: |
          git fetch --deepen=50 origin main
          git reset --hard origin/main

      - name: Dedup guard — skip if today's collect-links already committed
        id: dedup
        run: |
          # Force-bypass: when the workflow is dispatched with force=true, skip
          # the workflow-level dedup check entirely. This is the escape hatch
          # for re-scraping after a stale/late commit (e.g. a queued run from
          # yesterday committing today's data with last night's show_date —
          # which would otherwise dedup-block today's slot in 13 seconds).
          # Phase 2 honors the same `force=true` here for symmetry.
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force-running — bypassing dedup guard"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          pattern="data: box office ${{ github.event.inputs.tz_group }} collect-links"
          if git log --since="$today 00:00" --oneline --grep="$pattern" | grep -q .; then
            echo "Skipping — ${{ github.event.inputs.tz_group }} collect-links already ran today:"
            git log --since="$today 00:00" --oneline --grep="$pattern"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.dedup.outputs.skip != 'true'
        working-directory: box-office-tracker
        run: |
          pip3 install -r requirements.txt
          python3 -m playwright install chromium --with-deps || python3 -m playwright install chromium

      - name: Acquire AMC lock
        id: amc_lock
        if: steps.dedup.outputs.skip != 'true'
        timeout-minutes: 360
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 box-office-tracker/scripts/amc_lock.py acquire \
            --mode "collect-links-${{ github.event.inputs.tz_group }}" \
            --wait-seconds 18000 \
            --poll-seconds 60 \
            --github-output "$GITHUB_OUTPUT"

      - name: Phase 1 — collect showtime links (${{ github.event.inputs.tz_group }})
        if: steps.dedup.outputs.skip != 'true'
        working-directory: box-office-tracker
        timeout-minutes: 115
        env:
          PHASE1_FULL_WEEKEND_LINKS: 'true'
          PHASE1_MAX_THEATRE_DATE_VISITS: '2000'
        run: |
          set +e
          python3 scraper.py --collect-links ${{ github.event.inputs.tz_group }}
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Phase 1 failed coverage/runtime check; waiting 180s and retrying once under the same AMC lock."
            sleep 180
            python3 scraper.py --collect-links ${{ github.event.inputs.tz_group }}
            status=$?
          fi
          exit "$status"

      - name: Release AMC lock
        if: always() && steps.amc_lock.outputs.acquired == 'true'
        run: |
          python3 box-office-tracker/scripts/amc_lock.py release \
            --lock-sha "${{ steps.amc_lock.outputs.lock_sha }}"

      - name: Commit showtime links
        # Only commit a successful Phase 1. The scraper now validates fresh
        # link coverage before writing showtime-links.json; if coverage is low,
        # preserve the last good file and let Phase 2 repair/fail loudly.
        if: success() && steps.dedup.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only stage the files Phase 1 actually writes. A blanket
          # `git add box-office-tracker/` would sweep up any stray untracked
          # files (e.g. runner caches, locally-modified secrets).
          git add box-office-tracker/data/showtime-links.json \
                  box-office-tracker/data/theatre-counts.json \
                  box-office-tracker/data/polymarket-markets.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: box office ${{ github.event.inputs.tz_group }} collect-links"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash -X ours origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            if [ "$i" = "3" ]; then
              echo "All 3 push attempts failed — data not committed."
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            sleep $((i * 15))
          done

  # ──────────────────────────────────────────────────────────────────────────
  # Phase 2 — seat data scrape. Runs on ubuntu-latest matrix so each TZ gets
  # a fresh Azure IP, defeating AMC's Queue-It IP-flagging that had been
  # zeroing out CT/PT on the VPS IP. The matrix is intentionally serialized:
  # strict-zero AMC overlap is more important than scrape speed.
  #
  # Each matrix leg uploads its local CSV/log snapshot as an artifact and never
  # pushes to main. The finalize job is the only Phase 2 writer; it downloads all
  # scrape artifacts, dedupes rows, regenerates derived files, and commits once.
  # This removes the race that can strand rows behind a dirty worktree or failed
  # rebase while preserving partial data from crashed scrape legs.
  # ──────────────────────────────────────────────────────────────────────────
  scrape:
    if: github.event.inputs.phase == 'scrape'
    runs-on: ubuntu-latest
    timeout-minutes: 500
    strategy:
      fail-fast: false   # one TZ's Queue-It or timeout shouldn't cancel the others
      max-parallel: 1
      matrix:
        tz: [ET, CT, PT]   # MT intentionally omitted — too few theatres to be worth the Phase 1 schedule

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: Sync to latest main
        # Reset to current main before scraping so each artifact starts from the
        # newest committed baseline. The finalizer will dedupe any overlapping
        # rows from parallel legs.
        run: |
          git fetch --deepen=50 origin main
          git reset --hard origin/main

      - name: Dedup guard — skip if ${{ matrix.tz }} already scraped today
        id: dedup
        run: |
          python3 box-office-tracker/scripts/scrape_dedup_guard.py \
            --tz "${{ matrix.tz }}" \
            --force "${{ github.event.inputs.force }}" \
            --snapshots-only "${{ github.event.inputs.snapshots_only }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.dedup.outputs.skip != 'true'
        working-directory: box-office-tracker
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Acquire AMC lock
        id: amc_lock
        if: steps.dedup.outputs.skip != 'true'
        timeout-minutes: 360
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lane="regular"
          if [ "${{ github.event.inputs.snapshots_only }}" = "true" ]; then
            lane="snapshot"
          fi
          python3 box-office-tracker/scripts/amc_lock.py acquire \
            --mode "scrape-${lane}-${{ matrix.tz }}" \
            --wait-seconds 18000 \
            --poll-seconds 60 \
            --github-output "$GITHUB_OUTPUT"

      - name: Phase 2 — collect seat data (${{ matrix.tz }})
        if: steps.dedup.outputs.skip != 'true'
        working-directory: box-office-tracker
        timeout-minutes: 150
        run: |
          if [ "${{ github.event.inputs.snapshots_only }}" = "true" ]; then
            export SNAPSHOT_MAX_CONCURRENT_TABS=1
            export PHASE2_DEADLINE_SEC=8100
            echo "Snapshot lane: max tabs=$SNAPSHOT_MAX_CONCURRENT_TABS deadline=${PHASE2_DEADLINE_SEC}s"
          fi
          # Default-off: only pass --force when the input is explicitly "true".
          # Matches the workflow_dispatch input default of 'false' and the VPS
          # dispatch.sh default, so an empty/missing input can't silently
          # bypass the 12h staleness guard on showtime-links.json.
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          ENSURE_LINKS_FLAG="--ensure-links"
          if [ "${{ github.event.inputs.snapshots_only }}" = "true" ]; then
            ENSURE_LINKS_FLAG=""
          fi
          TEST_FLAG=""
          if [ -n "${{ github.event.inputs.test }}" ]; then TEST_FLAG="--test ${{ github.event.inputs.test }}"; fi
          SNAPSHOT_FLAG=""
          if [ "${{ github.event.inputs.pre_reservation_snapshots }}" = "true" ]; then
            SNAPSHOT_FLAG="--pre-reservation-snapshots"
          fi
          if [ "${{ github.event.inputs.snapshots_only }}" = "true" ]; then
            SNAPSHOT_FLAG="$SNAPSHOT_FLAG --snapshots-only"
          fi
          python scraper.py $ENSURE_LINKS_FLAG $FORCE_FLAG $TEST_FLAG $SNAPSHOT_FLAG ${{ matrix.tz }}

      - name: Release AMC lock
        if: always() && steps.amc_lock.outputs.acquired == 'true'
        run: |
          python3 box-office-tracker/scripts/amc_lock.py release \
            --lock-sha "${{ steps.amc_lock.outputs.lock_sha }}"

      - name: Write scrape manifest
        if: always()
        run: |
          mkdir -p box-office-tracker/data/scrape-manifest
          {
            echo "timezone=${{ matrix.tz }}"
            echo "dedup_skip=${{ steps.dedup.outputs.skip }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "workflow_job_status=${{ job.status }}"
          } > box-office-tracker/data/scrape-manifest/${{ matrix.tz }}.env

      - name: Upload scrape artifact
        # always() so partial data from a crashed scrape still reaches the
        # single-writer finalizer. The scraper flushes per-theatre, so even a
        # mid-run failure can have rows worth merging.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ matrix.tz }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            box-office-tracker/data/scrape-manifest/${{ matrix.tz }}.env
            box-office-tracker/data/seat-counts.csv
            box-office-tracker/data/pre-reservation-snapshots.csv
            box-office-tracker/data/polymarket-markets.csv
            box-office-tracker/data/run-logs/
            box-office-tracker/data/showtime-links.json
            box-office-tracker/data/theatre-counts.json

  # ──────────────────────────────────────────────────────────────────────────
  # Finalize — runs once after all matrix legs finish. Regenerates
  # predictions and xlsx from the fully-merged CSV. A single writer here
  # means no race on these derived artifacts.
  # ──────────────────────────────────────────────────────────────────────────
  finalize:
    needs: scrape
    # Run regardless of whether individual matrix legs succeeded (always()),
    # but skip if scrape didn't run at all (phase != scrape) or was cancelled.
    if: >
      always() &&
      github.event.inputs.phase == 'scrape' &&
      (needs.scrape.result == 'success' || needs.scrape.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: Sync to latest main
        # Finalize is the single Phase 2 writer. Start from current main, then
        # merge the downloaded matrix artifacts into canonical data files.
        run: |
          git fetch --deepen=50 origin main
          git reset --hard origin/main

      - name: Download scrape artifacts
        id: download_scrape_artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scrape-*
          path: box-office-tracker/data/scrape-artifacts

      - name: Merge scrape artifacts
        working-directory: box-office-tracker
        run: |
          python scripts/merge_scrape_artifacts.py data/scrape-artifacts \
            --marker-file /tmp/box-office-scrape-markers.txt \
            --summary-file /tmp/box-office-merge-summary.json

      - name: Finalize guard — skip if latest scrape already has derived artifacts
        id: finalize_guard
        run: |
          row_changes=$(python3 -c 'import json; s=json.load(open("/tmp/box-office-merge-summary.json")); print(sum(int(s.get(k, 0) or 0) for k in ("seat_added", "pre_reservation_added", "polymarket_added")))')
          if [ "$row_changes" -eq 0 ]; then
            echo "No canonical seat, snapshot, or market rows were merged; skipping finalize."
            echo "needs_finalize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git status --short -- \
            box-office-tracker/data/seat-counts.csv \
            box-office-tracker/data/pre-reservation-snapshots.csv \
            box-office-tracker/data/polymarket-markets.csv \
            box-office-tracker/data/run-logs)" ]; then
            echo "Merged scrape artifacts changed canonical data; finalize required."
            echo "needs_finalize=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_scrape=$(git log --format=%H --grep='data: box office .* scrape' -n 1 || true)
          latest_finalize=$(git log --format=%H \
            --grep='data: box office scrape merge + predictions' \
            --grep='data: box office predictions + xlsx' \
            -n 1 || true)
          if [ -z "$latest_scrape" ]; then
            echo "No scrape marker or artifact changes found; skipping finalize."
            echo "needs_finalize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$latest_finalize" ] && git merge-base --is-ancestor "$latest_scrape" "$latest_finalize"; then
            echo "Latest scrape $latest_scrape is already covered by finalize $latest_finalize; skipping duplicate finalize."
            echo "needs_finalize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest scrape $latest_scrape is not finalized yet."
          echo "needs_finalize=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        working-directory: box-office-tracker
        run: |
          pip install -r requirements.txt
          # No playwright needed here — predict.py and export_seat_counts_xlsx.py
          # are pure-pandas. Skipping the chromium download saves ~2 min.

      - name: Generate predictions
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        working-directory: box-office-tracker
        run: python predict.py

      - name: Refresh Excel workbook
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        working-directory: box-office-tracker
        run: python export_seat_counts_xlsx.py

      - name: Commit merged scrape data + predictions
        if: steps.finalize_guard.outputs.needs_finalize == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Explicit allow-list: commit canonical merged data and derived files,
          # never the downloaded artifact staging directory.
          python box-office-tracker/scripts/stage_finalize_outputs.py \
            --summary-file /tmp/box-office-merge-summary.json \
            --marker-file /tmp/box-office-scrape-markers.txt
          if git diff --staged --quiet; then
            echo "No canonical data or derived artifacts changed."
            exit 0
          fi
          commit_msg=/tmp/box-office-finalize-commit.txt
          printf "data: box office scrape merge + predictions\n\n" > "$commit_msg"
          if [ -s /tmp/box-office-scrape-markers.txt ]; then
            cat /tmp/box-office-scrape-markers.txt >> "$commit_msg"
          fi
          git commit -F "$commit_msg"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash -X ours origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            if [ "$i" = "3" ]; then
              echo "All 3 push attempts failed — derived artifacts not committed."
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            sleep $((i * 15))
          done

  # ──────────────────────────────────────────────────────────────────────────
  # Calibrate — Tuesday 10am ET only. Stays on VPS; doesn't hit AMC.
  # ──────────────────────────────────────────────────────────────────────────
  calibrate:
    if: github.event.inputs.phase == 'calibrate'
    runs-on: [self-hosted, vps]
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: false
          fetch-depth: 50

      - name: Sync to latest main
        run: |
          git fetch --deepen=50 origin main
          git reset --hard origin/main

      - name: Install dependencies
        working-directory: box-office-tracker
        run: pip3 install -r requirements.txt

      - name: Auto-calibrate
        working-directory: box-office-tracker
        run: python3 calibrate.py

      - name: Commit calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # calibrate.py writes calibration.json plus pre-actual calibration
          # freezes used for clean historical replay. Explicit allow-list so a
          # stray untracked file on the VPS runner (e.g. a playwright cache,
          # a locally-edited .env) can't ride along into the commit.
          git add box-office-tracker/data/calibration.json
          if compgen -G "box-office-tracker/data/calibration-freezes/*.json" > /dev/null; then
            git add box-office-tracker/data/calibration-freezes/*.json
          else
            echo "No calibration freeze files to stage."
          fi
          if git diff --staged --quiet; then
            echo "No calibration changes."
            exit 0
          fi
          git commit -m "data: box office calibration"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash -X ours origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            if [ "$i" = "3" ]; then exit 1; fi
            sleep $((i * 15))
          done
